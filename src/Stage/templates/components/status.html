<div id="status-box" style="
  position: fixed; bottom: 24px; right: 24px;
  width: 250px; padding: 16px;
  background: white;
  border: 0.5px solid rgba(0,0,0,0.1);
  border-radius: 12px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  font-family: inherit;
  z-index: 9999;
  animation: fadeIn 0.3s ease;
">

  <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
    <span style="width: 8px; height: 8px; border-radius: 50%; background: #0a0a0f; display: inline-block; flex-shrink: 0;"></span>
    <span style="font-size: 13px; font-weight: 500; color: #0a0a0f;">Traitement</span>
  </div>

  <p id="StatusMessage" style="font-size: 12px; color: #717182; margin: 0 0 10px;">En attente</p>

  <div style="width: 100%; height: 4px; background: #ececf0; border-radius: 99px; overflow: hidden;">
    <div id="StatusBar" style="height: 100%; width: 0%; background: #030213; border-radius: 99px; transition: width 0.3s;"></div>
  </div>

  <div style="text-align: right; font-size: 11px; color: #717182; margin-top: 4px;" id="StatusPct">0%</div>

</div>

<script>
function checkProgressStatus() {
  fetch("/progress/")
    .then(res => res.json())
    .then(data => {
      document.getElementById("StatusMessage").innerText = data.message;
      document.getElementById("StatusBar").style.width = data.progress + "%";
      document.getElementById("StatusPct").innerText = data.progress + "%";

      if (!data.is_done) {
        setTimeout(checkProgressStatus, 1000);
      }
    });
}

checkProgressStatus();
</script>

<style>
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
