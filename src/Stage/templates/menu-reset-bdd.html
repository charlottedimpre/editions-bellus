<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Menu Reset BDD Editions Bellus</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    {% include 'components/dropdown-menu.html' %}
    <div class="container">
        <h1>⚠️ Reset Base de Données</h1>

        <div class="menu-list">
            <a href="/" class="btn btn-nav">← Menu principal</a>

            <button class="btn btn-reset" onclick="resetAction('{% url 'reset_all' %}')">
                🗑️ 1. Reset all
            </button>

            <button class="btn btn-reset" onclick="resetAction('{% url 'reset_fiche_cadrage' %}')">
                📋 2. Reset fiche cadrage
            </button>

            <button class="btn btn-reset" onclick="resetAction('{% url 'reset_web_search' %}')">
                🔍 3. Reset recherches web
            </button>

            <button class="btn btn-reset" onclick="resetAction('{% url 'reset_plan_detail' %}')">
                🗂️ 4. Reset plan détaillés
            </button>

            <button class="btn btn-reset" onclick="resetAction('{% url 'reset_structure' %}')">
                ℹ️ 5. Reset structure
            </button>

            <button class="btn btn-reset" onclick="resetAction('{% url 'reset_intro' %}')">
                📝 6. Reset introduction
            </button>

            <button class="btn btn-reset" onclick="resetAction('{% url 'reset_sections_texte' %}')">
                📝 7. Reset texte section
            </button>

            <button class="btn btn-reset" onclick="resetAction('{% url 'reset_conclusion' %}')">
                📝 8. Reset Conclusion
            </button>
        </div>

        <p id="message" class="message"></p>
    </div>

    <script>
    function resetAction(url) {
        fetch(url, {
            method: "POST",
            headers: { "X-CSRFToken": "{{ csrf_token }}" }
        })
        .then(r => r.json())
        .then(data => {
            const msg = document.getElementById("message");
            msg.textContent = data.message;
            msg.classList.add("visible");
            setTimeout(() => msg.classList.remove("visible"), 4000);
        })
    }
    </script>
    {% include 'components/status.html' %}
</body>
</html>
