<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Variables globales</title>
    {% load static %}
    <link rel="icon" type="image/x-icon" href="{% static 'BELLUS_RVB_Fav_Noir.png' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-muted min-h-screen p-4">

{% include "components/dropdown-menu.html" %}

<div style="max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px;">

  <div class="bg-background border border-border rounded-xl p-4">

    <div class="flex justify-between items-start mb-1">
      <div>
        <h2 class="text-xl font-bold text-foreground">Variables globales</h2>
        <p class="text-sm text-muted-foreground mt-0.5 mb-4">Paramètres généraux du projet</p>
      </div>
    </div>

    <form method="POST">
    {% csrf_token %}

    <div class="py-4">
      <hr class="border-t border-border mb-4">
      <div class="flex gap-2">
        <button type="button" onclick="toggleEdit()"
          class="text-sm px-4 py-2 rounded-md bg-primary text-primary-foreground hover:opacity-90 flex items-center gap-1.5 font-medium">
          ✏️ Modifier
        </button>
        <button type="submit" id="saveBtn"
          class="text-sm px-4 py-2 rounded-md bg-primary text-primary-foreground hover:opacity-90 hidden items-center gap-1.5 font-medium">
          💾 Enregistrer
        </button>
        <button type="button" onclick="cancelEdit()" id="cancelBtn"
          class="text-sm px-4 py-2 rounded-md border border-border bg-background text-foreground hover:bg-muted hidden items-center gap-1.5">
          ❌ Annuler
        </button>
      </div>
    </div>

    <div class="flex flex-col gap-2.5">

      <!-- Nombre de chapitres -->
      <div class="border border-border rounded-lg p-4">
        <div class="text-sm font-semibold text-foreground mb-1">Nombre de chapitres</div>
        <div class="view-mode text-sm text-muted-foreground italic">{{ nb_chapitre|default:"Non défini" }}</div>
        <input class="edit-mode hidden w-full text-sm border border-border rounded-md p-2 mt-1 bg-background text-foreground"
               type="number" min="1" name="nb_chapitre" value="{{ nb_chapitre }}">
      </div>

      <!-- Nombre de mots cible -->
      <div class="border border-border rounded-lg p-4">
        <div class="text-sm font-semibold text-foreground mb-1">Nombre de mots cible</div>
        <div class="view-mode text-sm text-muted-foreground italic">{{ nb_mots_cible|default:"Non défini" }}</div>
        <input class="edit-mode hidden w-full text-sm border border-border rounded-md p-2 mt-1 bg-background text-foreground"
               type="number" min="1" name="nb_mots_cible" value="{{ nb_mots_cible }}">
      </div>

    </div>

    </form>
  </div>

</div>

{% include 'components/status.html' %}

<script>
let initialValues = {};

function toggleEdit() {
  document.querySelectorAll(".view-mode").forEach(v => v.classList.add("hidden"));
  document.querySelectorAll(".edit-mode").forEach((e, i) => { initialValues[i] = e.value; e.classList.remove("hidden"); });
  document.getElementById("saveBtn").classList.remove("hidden");
  document.getElementById("saveBtn").classList.add("flex");
  document.getElementById("cancelBtn").classList.remove("hidden");
  document.getElementById("cancelBtn").classList.add("flex");
}

function cancelEdit() {
  document.querySelectorAll(".edit-mode").forEach((e, i) => { if (initialValues[i] !== undefined) e.value = initialValues[i]; e.classList.add("hidden"); });
  document.querySelectorAll(".view-mode").forEach(v => v.classList.remove("hidden"));
  document.getElementById("saveBtn").classList.add("hidden");
  document.getElementById("cancelBtn").classList.add("hidden");
}
</script>

</body>
</html>
